services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - DB_HOST=database
      - ASPNETCORE_URLS=http://+:80
    ports:
      - "5000:80"
    depends_on:
      - database

  database:
    image: postgres:15
    environment:
      POSTGRES_USER: scarelli
      POSTGRES_PASSWORD: neymardemoicano2011
      POSTGRES_DB: db_login
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
